# Testing GitHub Actions workflow discovery

name: Project_500 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-pipeline:
    name: Test GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Project Information
        run: |
          echo "Welcome to Project 500"
          echo "GitHub Actions is running successfully!"
          echo "Environment: Development"

      - name: Check System
        run: |
          echo "Checking runner..."
          uname -a
          echo "Runner check completed."

      - name: Test Commands
        run: |
          echo "Testing basic commands..."
          git --version
          python --version
          echo "All commands executed successfully."

      - name: Final Pipeline Status
        run: |
          echo "================================"
          echo "PROJECT 500 PIPELINE SUCCESSFUL"
          echo "================================"
```
name: Complete CI/CD Pipeline

on:
  push:
    branches:
    - main

jobs:

  # =========================
  # JOB 1
  # =========================
  code-preparation:
    name: Code Preparation
    runs-on: ubuntu-latest

    steps:

      - name: Task 1 - Checkout repository
        uses: actions/checkout@v4

      - name: Task 2 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Task 3 - Display Node version
        run: node --version

      - name: Task 4 - Display npm version
        run: npm --version

      - name: Task 5 - Install dependencies
        run: npm ci

      - name: Task 6 - Check project files
        run: ls -la

      - name: Task 7 - Check package.json
        run: cat package.json

      - name: Task 8 - Check Git branch
        run: git branch

      - name: Task 9 - Check environment
        run: echo "Preparing CI environment"

      - name: Task 10 - Preparation complete
        run: echo "Code preparation completed"


  # =========================
  # JOB 2
  # =========================
  testing:
    name: Testing
    runs-on: ubuntu-latest

    needs: code-preparation

    steps:

      - name: Task 1 - Checkout code
        uses: actions/checkout@v4

      - name: Task 2 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Task 3 - Install dependencies
        run: npm ci

      - name: Task 4 - Run tests
        run: npm test

      - name: Task 5 - Run application test
        run: echo "Application test completed"

      - name: Task 6 - Check JavaScript
        run: find . -name "*.js"

      - name: Task 7 - Check HTML
        run: find . -name "*.html"

      - name: Task 8 - Check package configuration
        run: cat package.json

      - name: Task 9 - Generate test result
        run: echo "All tests passed" > test-result.txt

      - name: Task 10 - Testing complete
        run: echo "Testing completed successfully"


  # =========================
  # JOB 3
  # =========================
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    needs: testing

    steps:

      - name: Task 1 - Checkout code
        uses: actions/checkout@v4

      - name: Task 2 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Task 3 - Install dependencies
        run: npm ci

      - name: Task 4 - Run security audit
        run: npm audit --audit-level=high

      - name: Task 5 - Check dependencies
        run: npm list --depth=0

      - name: Task 6 - Check repository
        run: ls -la

      - name: Task 7 - Check configuration
        run: cat package.json

      - name: Task 8 - Security message
        run: echo "Security checks running"

      - name: Task 9 - Generate security result
        run: echo "Security checks completed"

      - name: Task 10 - Security complete
        run: echo "Security job completed"


  # =========================
  # JOB 4
  # =========================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs: security

    steps:

      - name: Task 1 - Checkout code
        uses: actions/checkout@v4

      - name: Task 2 - Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Task 3 - Install dependencies
        run: npm ci

      - name: Task 4 - Clean previous build
        run: rm -rf dist

      - name: Task 5 - Create build directory
        run: mkdir dist

      - name: Task 6 - Build application
        run: npm run build

      - name: Task 7 - Verify build
        run: ls -la dist

      - name: Task 8 - Check build files
        run: find dist -type f

      - name: Task 9 - Prepare artifact
        run: echo "Build artifact prepared"

      - name: Task 10 - Build complete
        run: echo "Build completed successfully"


  # =========================
  # JOB 5
  # =========================
  deployment:
    name: Deploy Application
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Task 1 - Checkout code
        uses: actions/checkout@v4

      - name: Task 2 - Prepare deployment
        run: echo "Preparing deployment"

      - name: Task 3 - Verify files
        run: ls -la

      - name: Task 4 - Verify application
        run: cat index.html

      - name: Task 5 - Configure environment
        run: echo "Production environment"

      - name: Task 6 - Deploy application
        run: echo "Deploying application..."

      - name: Task 7 - Verify deployment
        run: echo "Deployment verification"

      - name: Task 8 - Run health check
        run: echo "Health check passed"

      - name: Task 9 - Generate deployment result
        run: echo "Deployment successful" > deployment-result.txt

      - name: Task 10 - Deployment complete
        run: echo "CI/CD PIPELINE COMPLETED SUCCESSFULLY"